<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.w{padding:20px 24px;box-sizing:border-box}</style></head><body><div class="w" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
