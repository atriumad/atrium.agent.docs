<!-- @dsCard group="Effects" viewport="700x160" name="Motion & states" subtitle="Hover deepens the fill; press nudges down 1px. No scaling, no bounce." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.w{padding:20px 24px;box-sizing:border-box}</style></head><body><div class="w" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<span style="padding:11px 22px;border-radius:var(--radius-sm);background:var(--charcoal-800);color:var(--cream-200);font-size:15px;font-weight:500">Rest</span>
<span style="padding:11px 22px;border-radius:var(--radius-sm);background:var(--charcoal-900);color:var(--cream-200);font-size:15px;font-weight:500">Hover</span>
<span style="padding:11px 22px;border-radius:var(--radius-sm);background:var(--charcoal-900);color:var(--cream-200);font-size:15px;font-weight:500;transform:translateY(1px)">Press</span>
<span style="padding:11px 22px;border-radius:var(--radius-sm);background:var(--charcoal-800);color:var(--cream-200);font-size:15px;font-weight:500;opacity:.4">Disabled</span>
<span style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">200ms · cubic-bezier(.2,.8,.2,1)</span>
</div></body></html>
